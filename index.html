<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STRONG BLOG | MOVESBULL</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-zinc-950 text-white">

  <!-- HEADER -->
  <header class="fixed top-0 left-0 right-0 z-50 border-b border-zinc-800 bg-black/90 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-6 py-5 flex items-center justify-between">
      <div>
        <h1 class="text-4xl font-black tracking-tighter text-orange-500">STRONG BLOG</h1>
        <p class="text-sm tracking-[4px] text-zinc-400 -mt-1">MOVESBULL</p>
      </div>
      
      <nav class="hidden md:flex items-center gap-8 text-sm font-medium">
        <a href="#" class="hover:text-orange-500 transition-colors">BIO</a>
        <a href="#" class="hover:text-orange-500 transition-colors">PHOTO</a>
        <a href="https://www.donationalerts.com/r/aakgking" class="bg-black-600 hover:bg-black-500 px-7 py-3 rounded font-semibold transition-all">DONATE</a>
      </nav>

      <button id="mobile-menu-button" class="md:hidden text-3xl">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>

    <div id="mobile-menu" class="hidden md:hidden bg-zinc-900 border-t border-zinc-800 py-6">
      <div class="flex flex-col items-center gap-6 text-lg">
        <a href="#" class="hover:text-orange-500">BIO</a>
        <a href="#" class="hover:text-orange-500">PHOTO</a>
        <a href="#" class="bg-orange-600 hover:bg-orange-500 px-10 py-3 rounded font-semibold">DONATE</a>
      </div>
    </div>
  </header>

  <!-- HERO with Video -->
  <section class="hero-bg min-h-screen flex items-center relative">
    <div class="max-w-5xl mx-auto px-6 text-center pt-20 w-full">
      <div class="max-w-4xl mx-auto mt-10">
        <div id="video-container" class="relative aspect-video bg-black rounded-3xl overflow-hidden border-2 border-zinc-700 shadow-2xl">
          
          <!-- Play Overlay -->
          <div id="play-overlay" class="absolute inset-0 flex items-center justify-center bg-black/40 z-10 cursor-pointer transition-all hover:bg-black/30">
            <div class="w-28 h-28 bg-orange-600 hover:bg-orange-500 rounded-full flex items-center justify-center transition-all hover:scale-110">
              <i class="fa-solid fa-play text-5xl ml-2 text-white"></i>
            </div>
          </div>

          <!-- Video Player -->
          <div id="video-player" class="hidden w-full h-full">
            <iframe id="youtube-iframe" width="100%" height="100%" 
                    src="https://vk.com/video_ext.php?oid=-238363548&id=456239033&autoplay=1" 
                    title="YouTube video player" frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen></iframe>
          </div>
        </div>
      </div>
    </div>

    <div class="absolute bottom-0 left-0 right-0 h-40 bg-gradient-to-t from-zinc-950 to-transparent"></div>
  </section>

  <script src="script.js"></script>
</body>
</html>
